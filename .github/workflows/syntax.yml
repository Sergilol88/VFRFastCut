name: Localization cleanup

on:
  push:
    branches:
      - cleanup/localization-copy

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/localization-copy
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply copy cleanup
        run: python tools/localization_cleanup_temp.py

      - name: Validate source
        run: |
          python -m compileall -q vfr_fastcut.py vfr_keyframes.py tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vfr_fastcut.py
          if git diff --cached --quiet; then
            echo "No localization changes to commit."
          else
            git commit -m "Polish localized interface copy"
            git push origin HEAD:cleanup/localization-copy
          fi
