name: Publish VFR FastCut 0.2.36

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.2.36.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          ref: 7dbd54a8e1b7064c201491e087ca806fd8a0163f

      - name: Download verified portable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download 35919050293 \
            --repo Sergilol88/VFRFastCut \
            --name VFRFastCut-v0.2.36-Windows-x64 \
            --dir release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets

          test -f VFRFastCut-v0.2.36-Windows-x64.zip
          test -f VFRFastCut-v0.2.36-Windows-x64.zip.sha256
          test -f tools/ffmpeg-minimal/ffmpeg-9.0.2-source.tar.xz

          sha256sum -c VFRFastCut-v0.2.36-Windows-x64.zip.sha256

          expected_ffmpeg="8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
          actual_ffmpeg="$(sha256sum tools/ffmpeg-minimal/ffmpeg-9.0.2-source.tar.xz | awk '{print $1}')"
          test "$actual_ffmpeg" = "$expected_ffmpeg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.36 \
            --repo Sergilol88/VFRFastCut \
            --target 7dbd54a8e1b7064c201491e087ca806fd8a0163f \
            --title "VFR FastCut v0.2.36" \
            --notes-file release-notes/v0.2.36.md \
            release-assets/VFRFastCut-v0.2.36-Windows-x64.zip \
            release-assets/VFRFastCut-v0.2.36-Windows-x64.zip.sha256 \
            release-assets/tools/ffmpeg-minimal/ffmpeg-9.0.2-source.tar.xz
