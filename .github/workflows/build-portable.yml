name: Build portable Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-portable.yml'
      - 'vfr_fastcut.py'
      - 'vfr_keyframes.py'
      - 'requirements.txt'
      - 'VFRFastCut.ico'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_VERSIONS.md'
      - 'README.md'
      - 'README_RU.md'
      - 'tools/ffmpeg-minimal/**'
      - 'tools/release/**'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-portable.yml'
      - 'vfr_fastcut.py'
      - 'vfr_keyframes.py'
      - 'requirements.txt'
      - 'VFRFastCut.ico'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_VERSIONS.md'
      - 'README.md'
      - 'README_RU.md'
      - 'tools/ffmpeg-minimal/**'
      - 'tools/release/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.app.outputs.version }}

    env:
      FFMPEG_VERSION: "9.0.2"
      FFMPEG_SOURCE_SHA256: "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
      PYTHON_VERSION: "3.14.5"
      PYINSTALLER_VERSION: "6.21.0"

    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==$env:PYINSTALLER_VERSION"
          python -m compileall -q vfr_fastcut.py vfr_keyframes.py tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Read application version
        id: app
        shell: pwsh
        run: |
          $source = Get-Content .\vfr_fastcut.py -Raw
          $match = [regex]::Match($source, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Could not read APP_VERSION from vfr_fastcut.py"
          }
          $version = $match.Groups[1].Value

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag/version mismatch. Tag is $env:GITHUB_REF_NAME but APP_VERSION is $version."
            }
          }

          Write-Host "Application version: $version"

      - name: Restore minimal FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            tools/ffmpeg-minimal/runtime
            tools/ffmpeg-minimal/ffmpeg-9.0.2-source.tar.xz
          key: ffmpeg-minimal-${{ runner.os }}-${{ hashFiles('tools/ffmpeg-minimal/build-msys2-ucrt64.sh') }}

      - name: Set up MSYS2 UCRT64
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm

      - name: Build minimal FFmpeg runtime
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tools/ffmpeg-minimal/build-msys2-ucrt64.sh

      - name: Verify FFmpeg source and runtime
        shell: pwsh
        run: |
          $sourceArchive = ".\tools\ffmpeg-minimal\ffmpeg-$env:FFMPEG_VERSION-source.tar.xz"
          if (-not (Test-Path $sourceArchive)) {
            throw "Missing FFmpeg source archive: $sourceArchive"
          }

          $sourceHash = (Get-FileHash $sourceArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne $env:FFMPEG_SOURCE_SHA256) {
            throw "FFmpeg source SHA-256 mismatch. Expected $env:FFMPEG_SOURCE_SHA256, got $sourceHash"
          }

          $buildInfo = Get-Content .\tools\ffmpeg-minimal\runtime\BUILD_INFO.txt -Raw
          if ($buildInfo -notmatch [regex]::Escape($env:FFMPEG_SOURCE_SHA256)) {
            throw "BUILD_INFO.txt does not contain the expected FFmpeg source SHA-256."
          }

          .\tools\ffmpeg-minimal\verify.ps1

      - name: Build portable application
        shell: pwsh
        run: |
          Remove-Item .\build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\VFRFastCut.spec -Force -ErrorAction SilentlyContinue

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --contents-directory "." `
            --name "VFRFastCut" `
            --icon "VFRFastCut.ico" `
            --add-data "VFRFastCut.ico;." `
            --add-data "LICENSE;." `
            --add-data "THIRD_PARTY_NOTICES.md;." `
            --add-data "THIRD_PARTY_VERSIONS.md;." `
            --add-data "README.md;." `
            --add-data "README_RU.md;." `
            --add-data "LICENSES;LICENSES" `
            vfr_fastcut.py

          $pythonVersion = python -c "import platform; print(platform.python_version())"
          $pythonHome = python -c "import sys; print(sys.base_prefix)"
          $pythonLicense = Join-Path $pythonHome "LICENSE.txt"
          if (-not (Test-Path $pythonLicense -PathType Leaf)) {
            throw "Python LICENSE.txt not found at $pythonLicense"
          }

          $portableLicenseDir = ".\dist\VFRFastCut\LICENSES"
          New-Item -ItemType Directory -Force $portableLicenseDir | Out-Null
          Copy-Item $pythonLicense `
            (Join-Path $portableLicenseDir "Python-$pythonVersion-LICENSE.txt") `
            -Force

      - name: Package and audit portable build
        shell: pwsh
        run: |
          .\tools\release\package-portable.ps1 `
            -DistDir ".\dist\VFRFastCut" `
            -RuntimeDir ".\tools\ffmpeg-minimal\runtime" `
            -OutputDir "."

      - name: Upload portable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VFRFastCut-v${{ steps.app.outputs.version }}-Windows-x64
          path: |
            VFRFastCut-v${{ steps.app.outputs.version }}-Windows-x64.zip
            VFRFastCut-v${{ steps.app.outputs.version }}-Windows-x64.zip.sha256
            tools/ffmpeg-minimal/ffmpeg-9.0.2-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download verified portable artifact
        uses: actions/download-artifact@v4
        with:
          name: VFRFastCut-v${{ needs.build.outputs.version }}-Windows-x64
          path: release-assets

      - name: Reuse unchanged compliance source archives
        shell: pwsh
        run: |
          $previousTag = "v0.5.0"
          $sourceDir = Join-Path $PWD "release-assets"

          $sources = @{
            "ffmpeg-7.1.3.tar.xz" = "f0bf043299db9e3caacb435a712fc541fbb07df613c4b893e8b77e67baf3adbe"
            "qtbase-everywhere-src-6.11.2.tar.xz" = "5b2e00eccaf5a4d8c14134ffa0ea8dfd0a35ae1ffc7f8d87fa4305a1ed23cf22"
            "qtmultimedia-everywhere-src-6.11.2.tar.xz" = "967b5e02ec6b793cdb360622cd6e703132836af983208d678dae4b50f109cd9f"
            "qtsvg-everywhere-src-6.11.2.tar.xz" = "d594337feca84c26fb67fe87b85e6a5c12fda404b611d905f9d138210c311876"
            "pyside-setup-everywhere-src-6.11.2.tar.xz" = "cba47efbaad1bedd529725cbc14e21f156c7a19366f07b3edfbb076ffd7afdf8"
          }

          foreach ($entry in $sources.GetEnumerator()) {
            $target = Join-Path $sourceDir $entry.Key
            if (-not (Test-Path $target -PathType Leaf)) {
              gh release download $previousTag --pattern $entry.Key --dir $sourceDir
              if ($LASTEXITCODE -ne 0) {
                throw "Could not download $($entry.Key) from $previousTag."
              }
            }

            $actual = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "SHA-256 mismatch for $($entry.Key). Expected $($entry.Value), got $actual."
            }
          }

      - name: Publish release
        shell: pwsh
        run: |
          $tag = "v$env:APP_VERSION"
          $notes = ".\release-notes\$tag.md"
          if (-not (Test-Path $notes -PathType Leaf)) {
            throw "Release notes not found: $notes"
          }

          $portable = ".\release-assets\VFRFastCut-$tag-Windows-x64.zip"
          $checksum = "$portable.sha256"
          $projectFfmpeg = ".\release-assets\ffmpeg-9.0.2-source.tar.xz"

          foreach ($required in @($portable, $checksum, $projectFfmpeg)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Required release asset missing: $required"
            }
          }

          $assets = @(
            $portable,
            $checksum,
            $projectFfmpeg,
            ".\release-assets\ffmpeg-7.1.3.tar.xz",
            ".\release-assets\qtbase-everywhere-src-6.11.2.tar.xz",
            ".\release-assets\qtmultimedia-everywhere-src-6.11.2.tar.xz",
            ".\release-assets\qtsvg-everywhere-src-6.11.2.tar.xz",
            ".\release-assets\pyside-setup-everywhere-src-6.11.2.tar.xz"
          )

          gh release create $tag @assets --target $env:GITHUB_SHA --title "VFR FastCut $tag" --notes-file $notes --latest

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
