name: Build portable Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-portable.yml'
      - 'vfr_fastcut.py'
      - 'vfr_keyframes.py'
      - 'requirements.txt'
      - 'VFRFastCut.ico'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_VERSIONS.md'
      - 'README.md'
      - 'README_RU.md'
      - 'tools/ffmpeg-minimal/**'
      - 'tools/release/**'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-portable.yml'
      - 'vfr_fastcut.py'
      - 'vfr_keyframes.py'
      - 'requirements.txt'
      - 'VFRFastCut.ico'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_VERSIONS.md'
      - 'README.md'
      - 'README_RU.md'
      - 'tools/ffmpeg-minimal/**'
      - 'tools/release/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      FFMPEG_VERSION: "9.0.2"
      FFMPEG_SOURCE_SHA256: "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
      PYTHON_VERSION: "3.14.5"
      PYINSTALLER_VERSION: "6.21.0"

    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==$env:PYINSTALLER_VERSION"
          python -m compileall -q vfr_fastcut.py vfr_keyframes.py tests
          python -m unittest discover -s tests -p "test_*.py"

      - name: Read application version
        id: app
        shell: pwsh
        run: |
          $source = Get-Content .\vfr_fastcut.py -Raw
          $match = [regex]::Match($source, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Could not read APP_VERSION from vfr_fastcut.py"
          }
          $version = $match.Groups[1].Value

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag/version mismatch. Tag is $env:GITHUB_REF_NAME but APP_VERSION is $version."
            }
          }

          Write-Host "Application version: $version"

      - name: Restore minimal FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            tools/ffmpeg-minimal/runtime
            tools/ffmpeg-minimal/ffmpeg-9.0.2-source.tar.xz
          key: ffmpeg-minimal-${{ runner.os }}-${{ hashFiles('tools/ffmpeg-minimal/build-msys2-ucrt64.sh') }}

      - name: Set up MSYS2 UCRT64
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm

      - name: Build minimal FFmpeg runtime
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash tools/ffmpeg-minimal/build-msys2-ucrt64.sh

      - name: Verify FFmpeg source and runtime
        shell: pwsh
        run: |
          $sourceArchive = ".\tools\ffmpeg-minimal\ffmpeg-$env:FFMPEG_VERSION-source.tar.xz"
          if (-not (Test-Path $sourceArchive)) {
            throw "Missing FFmpeg source archive: $sourceArchive"
          }

          $sourceHash = (Get-FileHash $sourceArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne $env:FFMPEG_SOURCE_SHA256) {
            throw "FFmpeg source SHA-256 mismatch. Expected $env:FFMPEG_SOURCE_SHA256, got $sourceHash"
          }

          $buildInfo = Get-Content .\tools\ffmpeg-minimal\runtime\BUILD_INFO.txt -Raw
          if ($buildInfo -notmatch [regex]::Escape($env:FFMPEG_SOURCE_SHA256)) {
            throw "BUILD_INFO.txt does not contain the expected FFmpeg source SHA-256."
          }

          .\tools\ffmpeg-minimal\verify.ps1

      - name: Build portable application
        shell: pwsh
        run: |
          Remove-Item .\build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .\VFRFastCut.spec -Force -ErrorAction SilentlyContinue

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --contents-directory "." `
            --name "VFRFastCut" `
            --icon "VFRFastCut.ico" `
            --add-data "VFRFastCut.ico;." `
            --add-data "LICENSE;." `
            --add-data "THIRD_PARTY_NOTICES.md;." `
            --add-data "THIRD_PARTY_VERSIONS.md;." `
            --add-data "README.md;." `
            --add-data "README_RU.md;." `
            --add-data "LICENSES;LICENSES" `
            vfr_fastcut.py

          $pythonVersion = python -c "import platform; print(platform.python_version())"
          $pythonHome = python -c "import sys; print(sys.base_prefix)"
          $pythonLicense = Join-Path $pythonHome "LICENSE.txt"
          if (-not (Test-Path $pythonLicense -PathType Leaf)) {
            throw "Python LICENSE.txt not found at $pythonLicense"
          }

          $portableLicenseDir = ".\dist\VFRFastCut\LICENSES"
          New-Item -ItemType Directory -Force $portableLicenseDir | Out-Null
          Copy-Item $pythonLicense `
            (Join-Path $portableLicenseDir "Python-$pythonVersion-LICENSE.txt") `
            -Force

      - name: Package and audit portable build
        shell: pwsh
        run: |
          .\tools\release\package-portable.ps1 `
            -DistDir ".\dist\VFRFastCut" `
            -RuntimeDir ".\tools\ffmpeg-minimal\runtime" `
            -OutputDir "."

      - name: Upload portable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VFRFastCut-v${{ steps.app.outputs.version }}-Windows-x64
          path: |
            VFRFastCut-v${{ steps.app.outputs.version }}-Windows-x64.zip
            VFRFastCut-v${{ steps.app.outputs.version }}-Windows-x64.zip.sha256
            tools/ffmpeg-minimal/ffmpeg-9.0.2-source.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
