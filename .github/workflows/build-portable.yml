name: Build portable Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/build-portable.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      APP_VERSION: "0.2.33"
      FFMPEG_VERSION: "9.0.2"
      FFMPEG_SHA256: "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
      FFMPEG_URL: "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m py_compile vfr_fastcut.py

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg SHA-256 mismatch. Expected $env:FFMPEG_SHA256, got $hash"
          }

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
          $ffmpeg = Get-ChildItem ffmpeg-download -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-download -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "ffmpeg.exe or ffprobe.exe was not found in the verified archive."
          }

          New-Item -ItemType Directory -Force -Path ffmpeg\bin | Out-Null
          Copy-Item $ffmpeg.FullName ffmpeg\bin\ffmpeg.exe
          Copy-Item $ffprobe.FullName ffmpeg\bin\ffprobe.exe

          $gyanReadme = Get-ChildItem ffmpeg-download -Recurse -Filter README.txt | Select-Object -First 1
          if ($gyanReadme) {
            Copy-Item $gyanReadme.FullName LICENSES\FFmpeg-Gyan-README.txt
          }

          & .\ffmpeg\bin\ffmpeg.exe -version | Select-Object -First 1
          & .\ffmpeg\bin\ffprobe.exe -version | Select-Object -First 1

      - name: Write build information
        shell: pwsh
        run: |
          $pyside = python -c "import PySide6; print(PySide6.__version__)"
          $pyinstaller = python -m PyInstaller --version
          $python = python --version
          @"
          VFR FastCut portable build
          ===========================
          Application version: $env:APP_VERSION
          Git commit: $env:GITHUB_SHA
          Build platform: GitHub Actions windows-latest / x64
          $python
          PySide6: $pyside
          PyInstaller: $pyinstaller

          FFmpeg package: Gyan.dev release essentials
          FFmpeg version: $env:FFMPEG_VERSION
          Package URL: $env:FFMPEG_URL
          Package SHA-256: $env:FFMPEG_SHA256
          FFmpeg source commit: 946fcce07b
          Source: https://github.com/FFmpeg/FFmpeg/commit/946fcce07b
          License: GPLv3 (see LICENSES/GPL-3.0.txt and THIRD_PARTY_NOTICES.md)
          "@ | Set-Content -Encoding UTF8 BUILD_INFO.txt

      - name: Build portable application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --contents-directory "." `
            --name "VFRFastCut" `
            --icon "VFRFastCut.ico" `
            --add-data "VFRFastCut.ico;." `
            --add-data "LICENSE;." `
            --add-data "THIRD_PARTY_NOTICES.md;." `
            --add-data "README.md;." `
            --add-data "README_RU.md;." `
            --add-data "BUILD_INFO.txt;." `
            --add-data "LICENSES;LICENSES" `
            --add-binary "ffmpeg\bin\ffmpeg.exe;ffmpeg\bin" `
            --add-binary "ffmpeg\bin\ffprobe.exe;ffmpeg\bin" `
            vfr_fastcut.py

      - name: Verify portable contents
        shell: pwsh
        run: |
          $required = @(
            "dist\VFRFastCut\VFRFastCut.exe",
            "dist\VFRFastCut\ffmpeg\bin\ffmpeg.exe",
            "dist\VFRFastCut\ffmpeg\bin\ffprobe.exe",
            "dist\VFRFastCut\LICENSE",
            "dist\VFRFastCut\THIRD_PARTY_NOTICES.md",
            "dist\VFRFastCut\README.md",
            "dist\VFRFastCut\README_RU.md",
            "dist\VFRFastCut\BUILD_INFO.txt",
            "dist\VFRFastCut\LICENSES\GPL-3.0.txt",
            "dist\VFRFastCut\LICENSES\LGPL-3.0.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing portable file: $path" }
          }

          & dist\VFRFastCut\ffmpeg\bin\ffmpeg.exe -version | Select-Object -First 1
          & dist\VFRFastCut\ffmpeg\bin\ffprobe.exe -version | Select-Object -First 1

      - name: Create release ZIP
        shell: pwsh
        run: |
          $zip = "VFRFastCut-v$env:APP_VERSION-Windows-x64.zip"
          Compress-Archive -Path dist\VFRFastCut\* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ASCII "$zip.sha256"
          Write-Host "Portable ZIP: $zip"
          Write-Host "SHA-256: $hash"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: VFRFastCut-v0.2.33-Windows-x64
          path: |
            VFRFastCut-v0.2.33-Windows-x64.zip
            VFRFastCut-v0.2.33-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
