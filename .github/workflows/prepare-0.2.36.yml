name: Prepare VFR FastCut 0.2.36 release

on:
  push:
    branches:
      - release/v0.2.36

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata and packaged build path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # Final application version.
          path = "vfr_fastcut.py"
          text = read(path)
          old = 'APP_VERSION = "0.2.36-dev"'
          assert old in text
          write(path, text.replace(old, 'APP_VERSION = "0.2.36"', 1))

          # Final changelog heading and cautious wording based on tested behavior.
          path = "CHANGELOG.md"
          text = read(path)
          assert "## 0.2.36-dev" in text
          text = text.replace("## 0.2.36-dev", "## 0.2.36", 1)
          text = text.replace(
              "- This prevents the VRR / Adaptive Sync / NVIDIA G-SYNC display failures reproduced with the previous preview path, including black preview frames, flicker, and temporary full-monitor black screens.",
              "- The new preview path avoids the native presentation surface associated with the reproduced VRR / Adaptive Sync / NVIDIA G-SYNC failures, including black preview frames, flicker, and temporary full-monitor black screens.",
              1,
          )
          write(path, text)

          # Release build guide: bump version and remove the obsolete runtime hook.
          path = "BUILD.md"
          text = read(path).replace("0.2.35", "0.2.36")
          hook_arg = '--runtime-hook ".\\pyinstaller_runtime_hook.py" '
          assert hook_arg in text
          text = text.replace(hook_arg, "", 1)
          write(path, text)

          # CI portable build must match the tested final preview configuration.
          path = ".github/workflows/build-portable.yml"
          text = read(path)
          hook_path = "      - 'pyinstaller_runtime_hook.py'\n"
          hook_line = '            --runtime-hook ".\\pyinstaller_runtime_hook.py" `\n'
          assert hook_path in text
          assert hook_line in text
          text = text.replace(hook_path, "", 1)
          text = text.replace(hook_line, "", 1)
          write(path, text)

          # Third-party versions are unchanged for 0.2.36; extend the existing record.
          path = "THIRD_PARTY_NOTICES.md"
          text = read(path)
          text = text.replace(
              "For v0.2.34 and v0.2.35 the recorded versions are:",
              "For v0.2.34, v0.2.35 and v0.2.36 the recorded versions are:",
              1,
          )
          text = text.replace("## FFmpeg / FFprobe — v0.2.34 / v0.2.35", "## FFmpeg / FFprobe — v0.2.34 / v0.2.35 / v0.2.36", 1)
          text = text.replace("## MinGW runtime DLLs — v0.2.34 / v0.2.35", "## MinGW runtime DLLs — v0.2.34 / v0.2.35 / v0.2.36", 1)
          write(path, text)

          path = "THIRD_PARTY_VERSIONS.md"
          text = read(path)
          text = text.replace(
              "## VFR FastCut v0.2.34 / v0.2.35 — Windows x64",
              "## VFR FastCut v0.2.34 / v0.2.35 / v0.2.36 — Windows x64",
              1,
          )
          write(path, text)

          # Public release notes.
          release_notes = """# VFR FastCut v0.2.36

VFR FastCut v0.2.36 is a focused Windows preview-stability update for VRR / Adaptive Sync / NVIDIA G-SYNC configurations.

## Fixed

- Replaced the native `QVideoWidget` presentation path with a raster preview based on `QVideoSink -> QImage -> QWidget/QPainter`.
- In testing with VRR / Adaptive Sync and G-SYNC enabled, the new preview path did not reproduce the previous black preview frames, flicker, or temporary full-monitor black screens.
- The application no longer required a per-app NVIDIA G-SYNC exclusion in the tested configuration.
- Preview state is explicitly cleared when changing/resetting media and detached safely during shutdown.

## Preview runtime

- Qt Multimedia hardware video decoding remains enabled by default.
- Qt hardware texture conversion also remains at its default behavior.
- The v0.2.35 `QT_DISABLE_HW_TEXTURES_CONVERSION=1` packaged runtime hook has been removed so the portable build matches the final tested v0.2.36 configuration.

## Export behavior

Lossless export is unchanged in this release:

- FFmpeg stream copy (`-c copy`) is still used.
- No re-encoding is introduced.
- Video output remains MP4, MOV or MKV.
- Audio-only output remains MKA.
- All supported input containers from v0.2.35 remain supported.

## Runtime

The Windows portable package continues to use the project-specific minimal FFmpeg 9.0.2 runtime introduced in v0.2.34.

FFmpeg source:

`https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz`

Source SHA-256:

`8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e`

The exact `ffmpeg-9.0.2-source.tar.xz` used for the runtime should be published with the Release assets.

## Known follow-up

The raster preview currently uses more GPU 3D resources than desired on the tested system. Preview-performance optimization is intentionally deferred to a later release so v0.2.36 stays focused on display stability.
"""
          Path("release-notes/v0.2.36.md").write_text(release_notes, encoding="utf-8")

          # Obsolete and dangerous for the final tested v0.2.36 preview path.
          hook = Path("pyinstaller_runtime_hook.py")
          assert hook.exists()
          hook.unlink()

          # Remove this one-shot staging workflow from the resulting release commit.
          Path(".github/workflows/prepare-0.2.36.yml").unlink()
          PY

      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare VFR FastCut 0.2.36 release"
          git push origin HEAD:release/v0.2.36
